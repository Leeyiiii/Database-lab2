{% extends "base.html" %}
{% block title %}编辑学生 - 学籍管理系统{% endblock %}
{% block content %}
<h4><i class="bi bi-pencil-square"></i> 编辑学生信息 - {{ s[1] }}</h4>
<form method="POST" enctype="multipart/form-data" class="row g-3">
<div class="col-md-3"><label class="form-label">学号</label><input type="text" class="form-control" value="{{ s[0] }}" readonly></div>
<div class="col-md-3"><label class="form-label">姓名</label><input type="text" name="name" class="form-control" value="{{ s[1] }}" required></div>
<div class="col-md-3"><label class="form-label">性别</label><select name="gender" class="form-select"><option value="男" {% if s[2]=='男' %}selected{% endif %}>男</option><option value="女" {% if s[2]=='女' %}selected{% endif %}>女</option></select></div>
<div class="col-md-3"><label class="form-label">出生日期</label><input type="date" name="birth_date" class="form-control" value="{{ s[3] or '' }}"></div>
<div class="col-md-3"><label class="form-label">身份证号</label><input type="text" name="id_card" class="form-control" value="{{ s[4] or '' }}"></div>
<div class="col-md-3"><label class="form-label">籍贯</label><input type="text" name="native_place" class="form-control" value="{{ s[5] or '' }}"></div>
<div class="col-md-3"><label class="form-label">民族</label><input type="text" name="ethnicity" class="form-control" value="{{ s[6] or '' }}"></div>
<div class="col-md-3"><label class="form-label">政治面貌</label><input type="text" name="political_status" class="form-control" value="{{ s[7] or '' }}"></div>
<div class="col-md-3"><label class="form-label">电话</label><input type="text" name="phone" class="form-control" value="{{ s[8] or '' }}"></div>
<div class="col-md-3"><label class="form-label">邮箱</label><input type="email" name="email" class="form-control" value="{{ s[9] or '' }}"></div>
<div class="col-md-3"><label class="form-label">家庭地址</label><input type="text" name="home_address" class="form-control" value="{{ s[10] or '' }}"></div>
<div class="col-md-3"><label class="form-label">入学日期</label><input type="date" name="enrollment_date" class="form-control" value="{{ s[13] or '' }}"></div>
<div class="col-md-3"><label class="form-label">专业</label><select name="major_id" class="form-select"><option value="">未分配</option>{% for m in majors %}<option value="{{ m[0] }}" {% if s[14]==m[0] %}selected{% endif %}>{{ m[1] }}</option>{% endfor %}</select></div>
<div class="col-md-3"><label class="form-label">照片</label><input type="file" name="photo" class="form-control" accept="image/*">{% if s[11] %}<small class="text-muted">当前: {{ s[11] }}</small>{% endif %}</div>
<div class="col-md-3"><label class="form-label">简历</label><input type="file" name="resume" class="form-control" accept=".pdf,.doc,.docx">{% if s[12] %}<small class="text-muted">当前: {{ s[12] }}</small>{% endif %}</div>
<div class="col-12"><button type="submit" class="btn btn-warning">保存修改</button><a href="{{ url_for('student.list') }}" class="btn btn-secondary ms-2">返回</a></div>
</form>
{% endblock %}
