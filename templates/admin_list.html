{% extends "base.html" %}
{% block title %}管理员管理 - 学籍管理系统{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4><i class="bi bi-person-badge"></i> 管理员列表</h4>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addAdminModal">
        <i class="bi bi-plus-circle"></i> 添加管理员
    </button>
</div>
<table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr><th>ID</th><th>用户名</th><th>创建时间</th><th>操作</th></tr>
    </thead>
    <tbody>
        {% for a in admins %}
        <tr>
            <td>{{ a[0] }}</td>
            <td>{{ a[1] }}</td>
            <td>{{ a[2] }}</td>
            <td>
                <a href="{{ url_for('auth.admin_delete', aid=a[0]) }}" class="btn btn-sm btn-danger" onclick="return confirm('确定删除该管理员吗？')">删除</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<div class="modal fade" id="addAdminModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('auth.admin_create') }}">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">添加管理员</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
